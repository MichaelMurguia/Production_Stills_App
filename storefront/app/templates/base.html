<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Screenboard Studio{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/store.css">
</head>
<body>
<header class="site-head">
  <div class="wrap head-row">
    <a class="brand-link" href="/" title="Screenboard Studio — home">
      <p class="kicker">PRODUCTION TOOLING</p>
      <p class="wordmark">Screenboard Studio</p>
    </a>
    <div class="head-side">
      <nav class="head-links-nav" aria-label="Site">
        <a href="/pipeline"{% if request.url.path == "/pipeline" %} class="on"{% endif %}>The pipeline</a>
        <a href="/#gallery">Gallery</a>
        <a href="/#pricing">Pricing</a>
      </nav>
      {% if request.state.account_email %}
      <a class="head-account" href="/account" title="Your purchases">
        <img class="head-avatar" src="{{ request.state.account_avatar }}" alt="" referrerpolicy="no-referrer">
        <span class="mono head-email">{{ request.state.account_email }}</span>
      </a>
      <form method="post" action="/auth/logout" class="head-logout">
        <button class="btn btn-secondary head-signin" type="submit">Sign out</button>
      </form>
      {% else %}
      <a class="btn btn-secondary head-signin" href="/signin">Sign in</a>
      {% endif %}
    </div>
  </div>
</header>
<main{% block main_attrs %} class="wrap"{% endblock %}>
{% block content %}{% endblock %}
</main>
<footer class="site-foot">
  <div class="wrap foot-row">
    <p class="foot-meta">SCREENBOARD STUDIO &middot; canon-locked art direction for film</p>
    <p class="foot-links"><a href="/recover">Lost license</a> &middot;
      <a href="/terms">Terms</a> &middot; <a href="/privacy">Privacy</a></p>
  </div>
</footer>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Screenboard Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="/icons/favicon-32.png" sizes="32x32">
<link rel="icon" href="/icons/favicon-16.png" sizes="16x16">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="mask-icon" href="/icons/safari-pinned-tab.svg" color="#e0a33f">
<link rel="manifest" href="/icons/site.webmanifest">
<meta name="theme-color" content="#121417">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<header>
  <div class="brand">
    <span class="brand-title">SCREENBOARD</span>
    <span class="brand-sub" id="brand-project"></span><button class="brand-rename" id="brand-rename" title="Rename this production"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M17 3l4 4L8 20l-5 1 1-5L17 3z"/></svg></button>
  </div>
  <div class="head-right">
    <span class="engine-dots" id="engine-dots" title="Engine credentials — filled green: key saved here · blue: environment variable · hollow: none"></span>
    <nav class="tools" id="tools-nav">
      <button data-view="status" class="active" title="Where the project stands: the next action, everything blocking, and recent activity">Status</button>
      <button data-view="references" title="The one reference library: style anchors, cast &amp; subjects, scene anchors — everything a render can anchor to">Reference</button>
      <button data-view="projects" title="The Screenboard Library — every production on this install: create, open, back up, restore">Productions</button>
      <button data-view="settings" title="Engines, API keys, workflow reference, FAQ">Settings</button>
    </nav>
  </div>
</header>

<!-- The band IS the pipeline: five numbered stages in work order, each with a
     live status subline. Top-border color states progress (--ok complete,
     --accent current, --bad blocked, --line not reached); the HERE chip marks
     the viewed stage. Status/Reference/Settings are tools, not stages — they
     live in the header. app.js binds via closest("button[data-view]"). -->
<nav id="nav">
  <button data-view="screenplay" title="Stage 01 — the root dependency: the screenplay file, what it gave us per location, and citation health">
    <span class="stage-top"><span class="stage-n">01</span><span class="stage-l">Screenplay</span><span class="here-chip">HERE</span><span class="lock-chip">LOCKED</span></span>
    <span class="stage-sub" data-ssub="screenplay"></span>
  </button>
  <button data-view="wizard" title="Stage 02 — the visual concept: the wizard, the Art Direction Bible, style anchors, lessons learned">
    <span class="stage-top"><span class="stage-n">02</span><span class="stage-l">Prod. Design</span><span class="here-chip">HERE</span><span class="lock-chip">LOCKED</span></span>
    <span class="stage-sub" data-ssub="wizard"></span>
  </button>
  <button data-view="specs" title="Stage 03 — breakdown sheets: the script broken into each board's sets, dressing, props, and evidence">
    <span class="stage-top"><span class="stage-n">03</span><span class="stage-l">Breakdowns</span><span class="here-chip">HERE</span><span class="lock-chip">LOCKED</span></span>
    <span class="stage-sub" data-ssub="specs"></span>
  </button>
  <button data-view="boards" title="Stage 04 — the judging room: generate takes, review, approve panels">
    <span class="stage-top"><span class="stage-n">04</span><span class="stage-l">Panels</span><span class="here-chip">HERE</span><span class="lock-chip">LOCKED</span></span>
    <span class="stage-sub" data-ssub="boards"></span>
  </button>
  <button data-view="assembly" title="Stage 05 — board assembly: the slot map, layout variants, and the finished 4K boards">
    <span class="stage-top"><span class="stage-n">05</span><span class="stage-l">Boards</span><span class="here-chip">HERE</span><span class="lock-chip">LOCKED</span></span>
    <span class="stage-sub" data-ssub="assembly"></span>
  </button>
</nav>

<main id="main"></main>

<div id="toast" class="toast hidden"></div>

<div id="lightbox" class="lightbox hidden">
  <button class="lb-btn lb-close" title="Close (Esc)">×</button>
  <button class="lb-btn lb-prev" title="Previous (←)">‹</button>
  <button class="lb-btn lb-next" title="Next (→)">›</button>
  <div class="lb-stage"><img id="lb-img" alt=""></div>
  <div class="lb-bar">
    <span id="lb-caption"></span>
    <span id="lb-zoom" class="lb-zoomstate" title="Click image to toggle 100% pixel view"></span>
  </div>
</div>

<!-- Dashboard: what is blocking you leads at full width on the left; counts and
     standing rules recede into a sidebar. Same four render targets as before
     (#dash-cards, #dash-missing, #dash-prohibited, #dash-screenplay). -->
<!-- Status: the landing tool — the next action leads, everything blocking
     below it, counts and history in the sidebar. -->
<template id="tpl-status">
  <section class="view dash">
    <div class="dash-main">
      <div class="panel panel-lead" id="dash-next"></div>
      <div class="panel hidden" id="dash-missing"></div>
    </div>
    <aside class="dash-side">
      <div class="cards" id="dash-cards"></div>
      <div class="panel">
        <h2>Recent <span class="hint">(from the activity log)</span></h2>
        <div id="dash-recent"></div>
      </div>
      <div class="panel">
        <h2>Prohibited inventions <span class="hint">(from rejection history — enforced on every board)</span></h2>
        <ul id="dash-prohibited" class="taglist"></ul>
      </div>
    </aside>
  </section>
</template>

<!-- Screenplay: stage 01. The root dependency gets its own room — coverage
     table left, file card + downstream counts + replace right. -->
<template id="tpl-screenplay">
  <section class="view dash">
    <div class="dash-main">
      <div class="panel">
        <div class="stage-kicker">STAGE 01 OF 5</div>
        <h3 class="stage-headline">What the script gave us</h3>
        <p class="hint">Every location the read found, with how much the script actually says about each. Thin coverage means a breakdown here will lean on inference — and inference is budgeted.</p>
        <div id="dash-locations"></div>
      </div>
      <div class="panel hidden" id="scr-citations"></div>
    </div>
    <aside class="dash-side">
      <div class="panel">
        <h2>Current screenplay</h2>
        <div id="dash-screenplay"></div>
        <div id="scr-downstream"></div>
      </div>
      <div class="panel">
        <h2>Replace</h2>
        <p class="hint">A new draft does not invalidate approved work — cited quotes are re-checked and broken citations surface as CITE blockers for your review.</p>
        <form id="screenplay-form" class="row">
          <input type="file" id="screenplay-file" accept=".pdf,.fdx,.txt,.fountain" required>
          <button type="submit" class="primary">Upload a new draft</button>
        </form>
        <p class="mini">PDF · FDX · FOUNTAIN · TXT</p>
      </div>
    </aside>
  </section>
</template>

<!-- Assembly: stage 05. Sheet picker, slot map + variant picker, the
     assemble action, and the board gallery. -->
<template id="tpl-assembly">
  <section class="view">
    <div class="panel">
      <h2>Board assembly <span class="hint">(the slot map makes the never-upscaled rule visible before you spend a render)</span></h2>
      <div class="row" style="margin-top:0">
        <select id="asm-spec" style="max-width:480px"></select>
      </div>
    </div>
    <div id="assembly-host"></div>
  </section>
</template>

<!-- Production Design: the six steps run in order and carry their step number in
     the gutter. Reference documents (bible, lessons, keys) are parked at the
     bottom, out of the step sequence — they are not steps. -->
<template id="tpl-wizard">
  <section class="view">
    <div class="panel">
      <h2>Production design — the visual concept</h2>
      <p class="hint">Six steps produce your <b>Art Direction Bible</b> — the locked lookbook every render obeys. Work down the page; each step's output feeds the next.</p>
      <div id="wiz-screenplay" class="mini"></div>
    </div>

    <div class="panel step" data-step="1">
      <h2>Style reference images <span class="hint">(three movie parameters · one board parameter)</span></h2>
      <p class="hint">Four anchors, four jurisdictions. The first three define <b>the movie</b>; the fourth defines only <b>how boards are presented</b> — the film would be the same film in a different medium. Every render studies these. Subject photos (cast, vehicles, props) are research, not style: add them in step 4. Board <i>layout</i> lives at Assembly now, where real panels exist.</p>
      <!-- User-directed 2026-08-05: four anchor cells on one row — the
           fourth role had collapsed in its own undersized group grid.
           Group labels ride the same grid, spanning their columns. -->
      <div class="wiz-cols wiz-cols-anchors">
        <p class="wiz-group-label wiz-span3">THE MOVIE</p>
        <p class="wiz-group-label wiz-label-boards">THE BOARDS</p>
        <div class="wiz-col" data-role="WORLD_TEXTURE">
          <div class="wiz-col-head">
            <span class="f-label" title="The world's condition — how worn, patched, dusty, or pristine everything is allowed to look. Pristine is a texture philosophy too.">World Texture</span>
            <span class="badge LOCKED" data-f="state">NONE</span>
          </div>
          <p class="hint">CONTROLS wear, patina, entropy<br>NEVER subjects, palette, or light</p>
          <input type="file" accept="image/*" multiple data-f="files" title="Choose one or more images — they upload immediately as approved WORLD_TEXTURE anchors.">
          <div class="wiz-thumbs" data-f="list"></div>
        </div>
        <div class="wiz-col" data-role="COLOR_PALETTE">
          <div class="wiz-col-head">
            <span class="f-label" title="The film's color language — a palette board or color-script frames: permitted hues, how dark it keys, how far saturation travels.">Color Palette</span>
            <span class="badge LOCKED" data-f="state">NONE</span>
          </div>
          <p class="hint">CONTROLS hue, value key, saturation<br>NEVER framing, light source, or medium</p>
          <input type="file" accept="image/*" multiple data-f="files" title="Choose one or more palette boards or color-script frames — they upload immediately as approved COLOR_PALETTE anchors.">
          <!-- NON-CANON (user-directed 2026-08-05) — swatch add + Bible-cited
               generate; awaiting the designer's UI/UX pass. -->
          <div class="swatch-add">
            <input type="color" data-f="sw-color" value="#8a4b2e" title="Pick a color — it lands as an approved COLOR_PALETTE swatch">
            <input type="text" data-f="sw-hex" class="mono sw-hex-in" value="#8a4b2e" maxlength="7" spellcheck="false">
            <input type="text" data-f="sw-name" class="sw-name-in" placeholder="name — e.g. oxide rust" maxlength="48">
            <button class="ghost" data-f="sw-add">Add swatch</button>
          </div>
          <div class="wiz-thumbs" data-f="list"></div>
          <div class="swatch-gen" id="swatch-gen"></div>
          <div id="swatch-strip"></div>
        </div>
        <div class="wiz-col" data-role="CINEMATOGRAPHY_STYLE">
          <div class="wiz-col-head">
            <span class="f-label" title="How the film is photographed — stills whose light behaviour and framing you want. If a still's grade is loud, use it in black and white; palette belongs to the Color Palette anchor.">Cinematography</span>
            <span class="badge LOCKED" data-f="state">NONE</span>
          </div>
          <p class="hint">CONTROLS light behaviour, lens, framing<br>NEVER palette — nor a panel's hour: upload dawn, dusk, night</p>
          <input type="file" accept="image/*" multiple data-f="files" title="Choose one or more film stills — they upload immediately as approved CINEMATOGRAPHY_STYLE anchors.">
          <div class="wiz-thumbs" data-f="list"></div>
        </div>
        <div class="wiz-col" data-role="BOARD_RENDERING_STYLE">
          <div class="wiz-col-head">
            <span class="f-label" title="How panels are painted — an artwork whose medium, brushwork, and finish you want. Presentation only: nothing about the film.">Board Rendering Style</span>
            <span class="badge LOCKED" data-f="state">NONE</span>
          </div>
          <p class="hint">CONTROLS medium, brushwork, finish — how the work is PRESENTED<br>NEVER content, palette, or the world</p>
          <input type="file" accept="image/*" multiple data-f="files" title="Choose one or more artworks — they upload immediately as approved BOARD_RENDERING_STYLE anchors.">
          <div class="wiz-thumbs" data-f="list"></div>
        </div>
      </div>
    </div>

    <div class="panel step" data-step="2">
      <h2>Script Scene Scan</h2>
      <p class="hint">The research model scans every scene of the screenplay and returns the film's raw material for design: its <b>design languages</b> — the distinct visual cultures (factions, eras, technology families) that must each stay internally consistent — plus environments, key locations and open questions. Confirm, rename, or drop what it proposes; each language becomes a Bible section, selectable per board.</p>
      <div class="row">
        <div class="fgroup" title="Which model does the research and drafting. Both receive identical instructions."><span class="f-label">Model</span>
          <select id="wiz-provider">
            <option value="gemini">Gemini (research pass)</option>
            <option value="openai">OpenAI GPT-5.6</option>
          </select>
        </div>
        <div class="gen-actions"><button id="wiz-analyze" class="primary">Run the Scene Scan</button></div>
      </div>
      <div id="wiz-analyze-lock" class="mini" style="margin-top:8px"></div>
      <div id="wiz-analyze-busy"></div>
      <div id="wiz-analysis"></div>
    </div>

    <!-- Steps 3 and 4 swapped (LOCKED_STAGE_PLAN L3, director's note):
         the look interview precedes casting — a card's photos are
         reference gathering, not a precondition for drafting the bible. -->
    <div class="panel step" data-step="3">
      <h2>Interview <span class="hint">(skip anything — blanks come back marked PROPOSED)</span></h2>
      <p class="hint">Questions you answered in step 2 are already included.</p>
      <div class="grid-form">
        <label class="wide" title="Films, artists, or eras this should feel like — the strongest single lever on the look.">Visual touchstones <input type="text" id="wiz-touchstones" placeholder="films, artists, or eras this should feel like…"></label>
        <label title="The rendering medium and finish — becomes the Rendering Language section.">Medium &amp; finish <input type="text" id="wiz-medium" placeholder="e.g. painterly concept art, visible brushwork"></label>
        <label title="Color palette and light bias — becomes the Lighting Language section.">Palette &amp; light <input type="text" id="wiz-palette" placeholder="palette and light bias…"></label>
        <label class="wide" title="Hard exclusions — seeds the Rendering Language Avoid list.">It must never look like <input type="text" id="wiz-never" placeholder="e.g. glossy promotional key art, anime, photobash collage"></label>
        <label class="wide" title="Anything else the bible should honor.">Notes <textarea id="wiz-notes" placeholder="optional"></textarea></label>
      </div>
      <div class="mini" id="wiz-iv-state" aria-live="polite"></div>
    </div>

    <!-- Cast the film (mock 5b): a door into the Reference SUBJECTS shelf —
         the extraction proposes uncast subjects; casting creates the card
         in the library. The wizard owns the moment; the library owns the data. -->
    <div class="panel step" data-step="4">
      <h2>Cast the film <span class="hint">(cards live in Reference / SUBJECTS — this step is the door)</span></h2>
      <p class="hint">The screenplay read found these. Casting one creates its card in the library and carries the screenplay's identity text into every prompt it appears in. Upload photos into the card — they enter the library already approved, grouped under this exact name.</p>
      <div class="uncast-block">
        <div class="uncast-label">FOUND IN THE SCREENPLAY — UNCAST</div>
        <div id="wiz-subj-tags"></div>
        <div class="row" style="margin-top:10px">
          <input type="text" id="wiz-subj-name" placeholder="add manually — name…" style="max-width:240px" title="Name of a character, vehicle, or prop the screenplay read missed.">
          <select id="wiz-subj-kind" style="max-width:150px" title="CHARACTER → likeness reference; VEHICLE → geometry reference; PROP → prop reference.">
            <option>CHARACTER</option><option>VEHICLE</option><option>PROP</option>
          </select>
          <button class="ghost" id="wiz-subj-add">+ Cast</button>
        </div>
      </div>
      <div id="wiz-subj-grid" class="subj-grid"></div>
    </div>

    <!-- One bible surface (user-flagged duplication, 2026-08-01): the
         draft lands in the same editor it saves from. Interim unification
         ahead of the design ruling logged in DESIGN_SYSTEM.md. -->
    <div class="panel step" data-step="5">
      <h2>Art Direction Bible <span class="hint">(draft it, review it, save it — the single source every prompt draws from)</span></h2>
      <p class="hint">This is <code>context/01_ART_DIRECTION_BIBLE.md</code>. The compiler injects the sections that apply to each panel: global rendering language always; design-language and material sections when a board's scope selects them; scene-locked lessons when they match. Edits reach every future prompt immediately.</p>
      <div class="row" style="margin-top:0">
        <button id="wiz-draft" class="primary">Draft Art Direction Bible</button>
        <span class="hint">from screenplay + design languages + interview + attached reference photos — the draft appears below for review</span>
      </div>
      <div id="wiz-draft-busy"></div>
      <textarea id="style-bible" style="min-height:340px;font-family:'Courier New',Courier,monospace;font-size:13px;margin-top:12px"></textarea>
      <div class="row">
        <button class="ghost" id="style-save">Save Art Direction Bible</button>
        <span id="style-status" class="mini"></span>
      </div>
    </div>

    <div class="panel step" data-step="6">
      <h2>Model bake-off <span class="hint">(pick your default engine by looking, not guessing)</span></h2>
      <p class="hint">Every engine renders the <b>same location from your screenplay</b> under your saved Bible and approved anchors — the exact conditions real panel generations run under. Recommended locations come from step 2.</p>
      <div class="row" style="margin-top:0">
        <div class="fgroup" style="flex:1;max-width:420px" title="The screenplay location every engine renders. Recommendations come from the Step 2 Script Scene Scan; free text works too. Left blank, a generic fallback scene is used."><span class="f-label">Sample location</span>
          <input type="text" id="wiz-sample-loc" list="wiz-sample-locs" placeholder="run the Step 2 Scene Scan for suggestions, or type a location…">
          <datalist id="wiz-sample-locs"></datalist>
        </div>
        <div class="gen-actions"><button class="primary" id="wiz-samples-go" title="Sends the identical brief (your Bible + style anchors + the chosen screenplay location) to every engine you have a key for — one 1K render each.">Generate a sample from every model</button></div>
      </div>
      <div id="wiz-samples-busy"></div>
      <div class="wiz-cols" id="wiz-samples" style="margin-top:12px"></div>
    </div>


    <div class="panel">
      <h2>Lessons learned <span class="hint">(standing project-wide rules, added by hand)</span></h2>
      <p class="hint">These go into every future render prompt across all boards. Rejection reasons do <b>not</b> land here automatically — they become REJECTION FEEDBACK on that specific panel's future prompts. Use this list for rules that should apply everywhere.</p>
      <div id="lessons-list"></div>
    </div>
  </section>
</template>

<!-- Reference: ONE library, three shelves, sorted by when an image rides
     along (mock 5a). Subject cards ARE the middle shelf. -->
<template id="tpl-references">
  <section class="view">
    <div class="panel">
      <div class="stage-kicker">THE LIBRARY</div>
      <h3 class="stage-headline">Everything a render can anchor to</h3>
      <p class="hint">Three shelves, sorted by when an image rides along. Approve to make something canon; rejecting quarantines it — Reinstate brings it back.</p>
      <div class="ref-bar">
        <input type="text" id="ref-search" class="loc-search" style="margin:0" placeholder="find in library…" title="Filters every shelf — matches IDs, roles, titles, notes, and subject names">
        <button class="ghost" id="ref-add-btn" title="Add an image to the library — one image, one job">+ Add reference</button>
        <span class="ref-counts" id="ref-counts"></span>
      </div>
    </div>
    <div id="ref-shelves"></div>
  </section>
</template>

<template id="tpl-specs">
  <section class="view">
    <div class="panel panel-lead">
      <h2>Script breakdown <span class="hint">(draft a breakdown sheet from the screenplay)</span></h2>
      <p class="hint">Describe the board and the research pass reads the whole screenplay, extracts the sets, dressing, props, and evidence, and drafts the sheet — every claim cited, unknowns left honest. You review and edit before anything locks. Example: <i id="spec-auto-example">"the film's lead location — the scenes the script sets there"</i></p>
      <form id="spec-auto-form" class="grid-form">
        <label title="Unique ID for the new specification — CAPS_WITH_UNDERSCORES, versioned (e.g. MAIN_LOCATION_V001). Used in filenames, prompts, and the audit trail; it cannot be renamed later.">Spec ID <input type="text" id="spec-auto-id" placeholder="MAIN_LOCATION_V001" required></label>
        <label title="CANON_EXTRACTION: an official board — only what the screenplay actually supports, tight budget for guesses. DESIGN_EXPLORATION: you are deciding new visual canon — looser budget for inferences, but unsupported inventions are still zero.">Mode
          <select id="spec-auto-mode">
            <option value="CANON_EXTRACTION">CANON_EXTRACTION — official board, strict evidence</option>
            <option value="DESIGN_EXPLORATION">DESIGN_EXPLORATION — pitch me options</option>
          </select>
        </label>
        <label title="Which model reads the screenplay and drafts the specification. Gemini uses your Gemini key (fast research pass); OpenAI GPT-5.6 uses your OpenAI key. Both get the identical instructions and evidence rules — the draft always lands as an editable DRAFT for your review either way.">Model
          <select id="spec-auto-provider">
            <option value="gemini">Gemini (research pass)</option>
            <option value="openai">OpenAI GPT-5.6</option>
          </select>
        </label>
        <label class="wide" title="Plain-language description of the board you want — a location and which of its scenes. The research pass reads the whole screenplay with this as its brief and drafts panels, objects, and cited evidence.">What is this board about?
          <textarea id="spec-auto-prompt" placeholder="describe the board…" required></textarea>
        </label>
        <div class="row">
          <button type="submit" class="primary" id="spec-auto-go">Run breakdown</button>
          <span id="spec-auto-status" class="mini"></span>
        </div>
      </form>
    </div>
    <div class="panel">
      <h2>Breakdown sheets</h2>
      <table class="table" id="spec-table">
        <thead><tr><th>ID</th><th>Subject</th><th>Mode</th><th>Panels</th><th>Status</th><th></th></tr></thead>
        <tbody></tbody>
      </table>
      <form id="spec-new-form" class="row">
        <input type="text" id="spec-new-id" placeholder="SPEC ID e.g. GENETICS_FACTION_BOARD_V001" required title="Unique ID for the new specification — CAPS_WITH_UNDERSCORES, versioned. Used in filenames, prompts, and the audit trail; it cannot be renamed later.">
        <input type="text" id="spec-new-subject" placeholder="Subject" required title="What this board is about — a short human-readable name for the location, scene, prop, or character.">
        <select id="spec-new-mode" title="CANON_EXTRACTION: an official board — only what the screenplay actually supports, tight budget for guesses. DESIGN_EXPLORATION: you are deciding new visual canon — looser budget for inferences, but unsupported inventions are still zero.">
          <option value="CANON_EXTRACTION">CANON_EXTRACTION</option>
          <option value="DESIGN_EXPLORATION">DESIGN_EXPLORATION</option>
        </select>
        <select id="spec-new-btype" title="The board type seeds the sheet with its board grammar — panel count and allocations only (hero + supports), never content. Change it later and an untouched sheet re-templates on request."></select>
        <button type="submit" class="ghost">Create blank sheet</button>
      </form>
    </div>
    <div id="spec-editor"></div>
  </section>
</template>

<template id="tpl-boards">
  <section class="view">
    <div class="panel">
      <h2>Generate panels</h2>
      <p class="hint">Only signed-off (approved &amp; locked) breakdowns can generate. Every generation re-anchors to the approved references you attach — candidates are never canon until you approve them.</p>
      <div class="row">
        <label class="mini" title="Which signed-off breakdown to generate panels for. Drafts don't appear here — approve one on the Breakdowns tab first.">Breakdown&nbsp;
          <select id="board-spec"></select>
        </label>
      </div>
    </div>
    <div id="board-panels"></div>
  </section>
</template>

<template id="tpl-firstrun">
  <section class="firstrun">
    <div class="panel firstrun-panel">
      <div class="fact-head">FIRST RUN &mdash; NO PRODUCTIONS YET</div>
      <h1 class="firstrun-title">Name the show<br>you're working on.</h1>

    <div data-subview="workflow" class="hidden">
      <div class="panel doc">
        <h2>The workflow</h2>
        <p>This app builds <b>canon-locked art direction boards</b>. The chain is:</p>
        <p class="chain">Screenplay → Cast &amp; anchors (REFERENCE) → Specification → Approve &amp; lock → Generate panels → Approve panels → Assemble 4K board → Approve board → Promote to reference</p>
        <h3>1 — Load your sources (01 Screenplay / Reference)</h3>
        <p>Upload the current screenplay on stage 01 — it maps every location the script names and how much the script says about each. There is <b>one reference library</b> (Reference), on three shelves by when an image rides along: STYLE (every render, automatically), SUBJECTS (when its subject appears on a panel — cast the film in Production Design step 4 to fill it), SCENES (when a board covers its scene). Every image has a <b>narrow role</b>: a role is the reference's jurisdiction — a <code>CHARACTER_LIKENESS</code> photo controls that character's face and build, <i>not</i> their costume or lighting. Approve a reference to make it a canon anchor; rejecting quarantines the file from the pipeline (Reinstate returns it to provisional review).</p>
        <h3>2 — Write or auto-fill a breakdown sheet (03 Breakdowns)</h3>
        <p>A breakdown sheet is the brief you'd give a concept artist, written down and enforceable: panels (each answering one production question), required and forbidden objects, and an <b>evidence ledger</b> — one row per visible object saying why it's allowed to exist (screenplay quote, your direction, or approved canon). Run the breakdown to have the AI read the screenplay and draft the sheet; then edit. The CANNOT-LOCK strip lists anything approval would refuse; Approve &amp; lock freezes the sheet with a content hash.</p>
        <h3>3 — Generate and judge takes (04 Panels)</h3>
        <p>Each panel generates individually at native 1K/2K/4K — never upscaled. Every generation re-anchors to the approved references you attach; the prompt is compiled mechanically from the locked sheet and spells out each reference's role boundary. Takes land in the filmstrip as <b>CANDIDATE — UNAPPROVED</b> until you judge them; reject with a specific reason and it feeds the panel's future prompts. Repair region fixes a painted area with your choice of engine.</p>
        <h3>4 — Assemble the board (05 Boards)</h3>
        <p>The slot map shows the exact canvas geometry and a verdict per slot before you spend anything. Once every slot reads OK, <b>Assemble 4K board</b> composes the approved takes onto a true 4K canvas with board typography drawn by the app (never by the model). Slots crop images to fit the layout — the originals stay one click away in the judging room. Layout variants (default / grid / hero) are presentation only — recorded on the board, the locked sheet untouched. Nothing is ever blown up: a take too small to fill its slot is letterboxed and flagged instead.</p>
        <h3>5 — Close the loop</h3>
        <p>Approve the board, then <b>→ Reference</b> promotes it (or any approved panel) into the reference library — e.g. as a <code>SCENE_REFERENCE</code> anchoring that screenplay scene. Future generations attach it, so consistency tightens with every approval. That is how the system improves over time without drifting.</p>
        <h3>Canon vs. Design Exploration</h3>
        <p><b>CANON_EXTRACTION</b>: paint what the screenplay and approved canon already establish. Strict — nothing unsupported, max 2 weak inferences. For official boards.<br>
        <b>DESIGN_EXPLORATION</b>: the screenplay is silent, pitch me options. Everything is proposed-not-canon until you approve a winner and promote it.</p>
      </div>

    <div data-subview="faq" class="hidden">
      <div class="panel doc">
        <h2>FAQ</h2>
        <h3>Why can't I generate from my sheet?</h3>
        <p>Only <b>approved &amp; locked</b> sheets can generate. The CANNOT-LOCK strip on the sheet lists exactly what approval would refuse — every required object needs a PASS evidence row, allocation must total 100%, every row needs a citation.</p>
        <h3>Why is my evidence row on HOLD?</h3>
        <p>Auto-fill marks weak inferences HOLD deliberately — the model is not allowed to promote its own guesses. Read the cited source; if you agree, set the row to PASS yourself (you are the evidence when you do — that's <code>USER_DIRECTED</code>). A sheet can't lock with HOLD rows on required objects.</p>
        <h3>What happens when I replace the screenplay?</h3>
        <p>Approved work is never invalidated. Every quoted citation on every sheet is re-searched in the new draft; quotes that vanish surface as CITE blockers on Status and in the Broken Citations panel on stage 01 — for your review, never auto-corrected.</p>
        <h3>Why did assembly warn about a panel?</h3>
        <p>That panel's render cannot fill its slot on the 4K canvas at native size. The app never upscales — it letterboxes and flags instead. Regenerate that panel at a larger size (usually 4K), or use → Full-size take, and re-approve it.</p>
        <h3>What image sizes should I use?</h3>
        <p>Iterate at 2K (cheaper, faster), regenerate final picks at 4K. Hero slots fill best with 4:3 or 3:2 aspect; the right-column strips suit 16:9 or 21:9.</p>
        <h3>What happens when I reject something?</h3>
        <p>Rejected references are physically quarantined — the pipeline cannot attach them again. Rejected candidates stay visible (dimmed) as a record. Rejection reasons are stored.</p>
        <h3>Can a generated image become a reference?</h3>
        <p>Yes — that's the point. Approve it, then <b>→ Reference</b> with a role (e.g. <code>SCENE_REFERENCE</code>). It enters the library pre-approved and anchors future work.</p>
        <h3>Where is everything stored?</h3>
        <p>Locally: <code>data/</code> holds references, screenplay, specs, boards, and your API key. <code>project_state/approval_log.md</code> is the running approval record. Nothing goes to any server except generation calls to Google.</p>
        <h3>What does a generation cost?</h3>
        <p>Each render is a paid API call to the engine you picked, billed to your key — rejected takes cost the same as approved ones, which is why validation runs before generation and the slot map shows readiness before assembly.</p>
      </div>

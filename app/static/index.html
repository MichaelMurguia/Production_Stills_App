<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Screenboard Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="/icons/favicon-32.png" sizes="32x32">
<link rel="icon" href="/icons/favicon-16.png" sizes="16x16">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="mask-icon" href="/icons/safari-pinned-tab.svg" color="#e0a33f">
<link rel="manifest" href="/icons/site.webmanifest">
<meta name="theme-color" content="#121417">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<header>
  <div class="brand">
    <a class="brand-title" id="brand-home" href="https://www.screenboardstudio.com"
      target="_blank" rel="noopener"
      title="screenboardstudio.com — opens in a new tab, so your studio stays where it is">SCREENBOARD</a>
    <span class="brand-sub" id="brand-project"></span><button class="brand-rename" id="brand-rename" title="Rename this production"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M17 3l4 4L8 20l-5 1 1-5L17 3z"/></svg></button>
  </div>
  <div class="head-right">
    <span class="engine-dots" id="engine-dots" title="Engine credentials — filled green: key saved here · blue: environment variable · hollow: none"></span>
    <nav class="tools" id="tools-nav">
      <button data-view="status" class="active" title="Where the project stands: the next action, everything blocking, and recent activity">Status</button>
      <button data-view="references" title="The one reference library: style anchors, cast &amp; subjects, scene anchors — everything a render can anchor to">Reference</button>
      <button data-view="settings" title="Productions, engines, API keys, workflow reference, FAQ">Settings</button>
    </nav>
  </div>
</header>

<!-- The band IS the pipeline: five numbered stages in work order, each with a
     live status subline. Top-border color states progress (--ok complete,
     --accent current, --bad blocked, --line not reached); the HERE chip marks
     the viewed stage. Status/Reference/Settings are tools, not stages — they
     live in the header. app.js binds via closest("button[data-view]"). -->
<nav id="nav">
  <button data-view="screenplay" title="Stage 01 — the root dependency: the screenplay file, what it gave us per location, and citation health">
    <span class="stage-top"><span class="stage-n">01</span><span class="stage-l">Screenplay</span><span class="here-chip">HERE</span><span class="lock-chip">LOCKED</span></span>
    <span class="stage-sub" data-ssub="screenplay"></span>
  </button>
  <button data-view="wizard" title="Stage 02 — the visual concept: the wizard, the Art Direction Bible, style anchors, lessons learned">
    <span class="stage-top"><span class="stage-n">02</span><span class="stage-l">Prod. Design</span><span class="here-chip">HERE</span><span class="lock-chip">LOCKED</span></span>
    <span class="stage-sub" data-ssub="wizard"></span>
  </button>
  <button data-view="specs" title="Stage 03 — breakdowns: the script broken into each board's sets, dressing, props, and evidence">
    <span class="stage-top"><span class="stage-n">03</span><span class="stage-l">Breakdowns</span><span class="here-chip">HERE</span><span class="lock-chip">LOCKED</span></span>
    <span class="stage-sub" data-ssub="specs"></span>
  </button>
  <button data-view="boards" title="Stage 04 — the judging room: generate takes, review, approve panels">
    <span class="stage-top"><span class="stage-n">04</span><span class="stage-l">Panels</span><span class="here-chip">HERE</span><span class="lock-chip">LOCKED</span></span>
    <span class="stage-sub" data-ssub="boards"></span>
  </button>
  <button data-view="assembly" title="Stage 05 — board assembly: the slot map, layout variants, and the finished 4K boards">
    <span class="stage-top"><span class="stage-n">05</span><span class="stage-l">Boards</span><span class="here-chip">HERE</span><span class="lock-chip">LOCKED</span></span>
    <span class="stage-sub" data-ssub="assembly"></span>
  </button>
</nav>

<main id="main"></main>

<div id="toast" class="toast hidden"></div>

<div id="lightbox" class="lightbox hidden">
  <button class="lb-btn lb-close" title="Close (Esc)">×</button>
  <button class="lb-btn lb-prev" title="Previous (←)">‹</button>
  <button class="lb-btn lb-next" title="Next (→)">›</button>
  <div class="lb-stage"><img id="lb-img" alt=""></div>
  <div class="lb-bar">
    <span id="lb-caption"></span>
    <span id="lb-zoom" class="lb-zoomstate" title="Click image to toggle 100% pixel view"></span>
  </div>
</div>

<!-- Dashboard: what is blocking you leads at full width on the left; counts and
     standing rules recede into a sidebar. Same four render targets as before
     (#dash-cards, #dash-missing, #dash-prohibited, #dash-screenplay). -->
<!-- Status: the landing tool — the next action leads, everything blocking
     below it, counts and history in the sidebar. -->
<template id="tpl-status">
  <section class="view dash">
    <div class="dash-main">
      <div class="panel panel-lead" id="dash-next"></div>
      <div class="panel hidden" id="dash-missing"></div>
    </div>
    <aside class="dash-side">
      <div class="cards" id="dash-cards"></div>
      <div class="panel">
        <h2>Recent <span class="hint">(from the activity log)</span></h2>
        <div id="dash-recent"></div>
      </div>
      <div class="panel">
        <h2>Prohibited inventions <span class="hint">(from rejection history — enforced on every board)</span></h2>
        <ul id="dash-prohibited" class="taglist"></ul>
      </div>
    </aside>
  </section>
</template>

<!-- Screenplay: stage 01. The root dependency gets its own room — coverage
     table left, file card + downstream counts + replace right. -->
<template id="tpl-screenplay">
  <section class="view dash">
    <div class="dash-main">
      <div class="panel">
        <div class="stage-kicker">STAGE 01 OF 5</div>
        <h3 class="stage-headline">What the script gave us</h3>
        <p class="hint">Every location the read found, with how much the script actually says about each. Thin coverage means a breakdown here will lean on inference — and inference is budgeted.</p>
        <div id="dash-locations"></div>
      </div>
      <div class="panel hidden" id="scr-citations"></div>
    </div>
    <aside class="dash-side">
      <div class="panel">
        <h2>Current screenplay</h2>
        <div id="dash-screenplay"></div>
        <div id="scr-downstream"></div>
      </div>
      <div class="panel">
        <h2>Replace</h2>
        <p class="hint">A new draft does not invalidate approved work — cited quotes are re-checked and broken citations surface as CITE blockers for your review.</p>
        <form id="screenplay-form" class="row">
          <input type="file" id="screenplay-file" accept=".pdf,.fdx,.txt,.fountain" required>
          <button type="submit" class="primary">Upload a new draft</button>
        </form>
        <p class="mini">PDF · FDX · FOUNTAIN · TXT</p>
      </div>
    </aside>
  </section>
</template>

<!-- Assembly: stage 05. Sheet picker, slot map + variant picker, the
     assemble action, and the board gallery. -->
<template id="tpl-assembly">
  <section class="view">
    <div class="panel">
      <h2>Board assembly <span class="hint">(the slot map makes the never-upscaled rule visible before you spend a render)</span></h2>
      <div class="row" style="margin-top:0">
        <select id="asm-spec" style="max-width:480px"></select>
      </div>
    </div>
    <div id="assembly-host"></div>
  </section>
</template>

<!-- Production Design: the six steps run in order and carry their step number in
     the gutter. Reference documents (bible, lessons, keys) are parked at the
     bottom, out of the step sequence — they are not steps. -->
<template id="tpl-wizard">
  <section class="view wiz-v3">
    <!-- PRODUCTION_DESIGN_V3 D1/D2 — a step states what it does to the
         movie, never what it is. The header strip carries the page's one
         sentence, the screenplay fact, and the six-step rail. -->
    <div class="panel wiz-head">
      <span class="wiz-head-label">FIVE STEPS &rarr; ART DIRECTION BIBLE</span>
      <div id="wiz-screenplay" class="wiz-head-file"></div>
      <div class="step-rail" id="wiz-rail"></div>
    </div>

    <!-- The look interview LEADS (user 2026-08-07): what the director
         wants it to feel like is stated before the machine reads anything.
         It has no dependency on the scan — five free-text fields — so
         nothing gates it. Steps 3 and 4 remain swapped from
         LOCKED_STAGE_PLAN L3: the interview precedes casting. -->
    <div class="panel step" data-step="1">
      <h2>Style anchors</h2>
      <div class="wiz-cols wiz-cols-anchors">
        <p class="wiz-group-label wiz-span3">THE MOVIE</p>
        <p class="wiz-group-label wiz-label-boards">THE BOARDS</p>
        <div class="wiz-col" data-role="WORLD_TEXTURE">
          <div class="wiz-col-head">
            <span class="f-label" title="The world's condition — how worn, patched, dusty, or pristine everything is allowed to look. Pristine is a texture philosophy too.">World Texture</span>
            <span class="badge LOCKED" data-f="state">NONE</span>
          </div>
          <p class="hint">SETS wear, patina, entropy<br>NOT subjects &middot; palette &middot; light</p>
          <button class="ghost wiz-add-btn wiz-offpage" data-f="addbtn" tabindex="-1">Add images</button>
          <input type="file" accept="image/*" multiple data-f="files" hidden>
          <label class="wiz-words" title="The world&rsquo;s condition — wear, patina, entropy.">
            <input type="text" data-f="words" id="wiz-texture" hidden>
            <button type="button" class="ghost pick-btn" id="wiz-texture-pick">Choose a world texture</button>
          </label>
          <div class="wiz-thumbs wiz-offpage" data-f="list"></div>
        </div>
        <div class="wiz-col" data-role="COLOR_PALETTE">
          <div class="wiz-col-head">
            <span class="f-label" title="The film's color language — a palette board or color-script frames: permitted hues, how dark it keys, how far saturation travels.">Color Palette</span>
            <span class="badge LOCKED" data-f="state">NONE</span>
          </div>
          <p class="hint">SETS hue, value key, saturation<br>NOT framing &middot; light source &middot; medium</p>
          <button class="ghost wiz-add-btn" data-f="addbtn">Add images</button>
          <input type="file" accept="image/*" multiple data-f="files" hidden>
          <!-- The adder is a BUTTON, not a live row (user-hit 2026-08-22:
               "I am still getting the odd Oxide color swatch that shows up
               when there are no other color swatches"). It held an
               `<input type="color" value="#8a4b2e">`, which a browser draws
               as a filled rust square — indistinguishable from a swatch,
               sitting in the column of a production that had none. The form
               it opens is the one that already existed for editing a
               swatch. -->
          <div class="swatch-add">
            <button class="ghost" data-f="sw-add">Add swatch</button>
          </div>
          <label class="wiz-words" title="The film&rsquo;s color language in words — hue, value key, saturation.">In words
            <input type="text" data-f="words" id="wiz-palette" placeholder="e.g. oxide and bone, low key, saturation held back">
          </label>
          <div class="wiz-thumbs" data-f="list"></div>
          <div id="swatch-strip"></div>
        </div>
        <div class="wiz-col" data-role="CINEMATOGRAPHY_STYLE">
          <div class="wiz-col-head">
            <span class="f-label" title="How the film is photographed — stills whose light behaviour and framing you want. If a still's grade is loud, use it in black and white; palette belongs to the Color Palette anchor.">Cinematography</span>
            <span class="badge LOCKED" data-f="state">NONE</span>
          </div>
          <p class="hint">SETS light behaviour, contrast, source<br>NOT palette &middot; lens &middot; a panel's hour</p>
          <button class="ghost wiz-add-btn wiz-offpage" data-f="addbtn" tabindex="-1">Add images</button>
          <input type="file" accept="image/*" multiple data-f="files" hidden>
          <label class="wiz-words" title="Light behaviour, lens and framing — becomes the Lighting Language and Composition Rules sections.">In words
            <input type="text" data-f="words" id="wiz-light" hidden>
            <button type="button" class="ghost pick-btn" id="wiz-light-pick">Choose a cinematography look</button>
          </label>
          <div class="fgroup cam-default wiz-offpage" id="cam-default" title="The production's default camera grammar — the shot every panel starts from unless it overrides on the breakdown. The app writes the professional directive into every render prompt. Change any axis to reset the default.">
        <span class="f-label">Camera grammar <span class="hint">choose the default lens — you can override it when you render</span></span>
        <div id="cam-default-row"></div>
        <span id="cam-default-status" class="mini"></span>
      </div>
          <div class="wiz-thumbs wiz-offpage" data-f="list"></div>
        </div>
        <div class="wiz-col" data-role="BOARD_RENDERING_STYLE">
          <div class="wiz-col-head">
            <span class="f-label" title="How panels are painted — an artwork whose medium, brushwork, and finish you want. Presentation only: nothing about the film.">Board Rendering</span>
            <span class="badge LOCKED" data-f="state">NONE</span>
          </div>
          <p class="hint">SETS medium, brushwork, finish<br>NOT content &middot; palette &middot; the world</p>
          <button class="ghost wiz-add-btn wiz-offpage" data-f="addbtn" tabindex="-1">Add images</button>
          <input type="file" accept="image/*" multiple data-f="files" hidden>
          <label class="wiz-words" title="The rendering medium and finish — becomes the Rendering Language section.">In words
            <input type="text" data-f="words" id="wiz-medium" hidden>
            <button type="button" class="ghost pick-btn" id="wiz-medium-pick">Choose a rendering style</button>
          </label>
          <label class="wiz-words wiz-offpage" id="wiz-never-row" title="Hard exclusions — translated item for item into the Rendering Language Avoid list.">Never looks like
            <input type="text" id="wiz-never" placeholder="e.g. glossy promotional key art, anime, photobash collage">
          </label>
          <div class="wiz-thumbs wiz-offpage" data-f="list"></div>
        </div>
      </div>
    </div>

    <div class="panel step" data-step="2">
      <h2>Script scene scan</h2>
      <div class="row">
        <div class="fgroup" title="Which model does the research and drafting. Both receive identical instructions."><span class="f-label">Model</span>
          <select id="wiz-provider">
            <option value="gemini">Gemini (research pass)</option>
            <option value="openai">OpenAI GPT-5.6</option>
          </select>
        </div>
        <div class="gen-actions"><button id="wiz-analyze" class="primary">Run the Scene Scan</button></div>
      </div>
      <div id="wiz-analyze-lock" class="mini" style="margin-top:8px"></div>
      <div id="wiz-analyze-busy"></div>
      <div id="wiz-analysis"></div>
    </div>

    <!-- Cast the film (mock 5b): a door into the Reference SUBJECTS shelf. -->
    <div class="panel step" data-step="3">
      <h2>Cast the film <span class="step-cond">CASTING MAKES A CARD IN REFERENCE / SUBJECTS &middot; ITS SCREENPLAY IDENTITY RIDES EVERY PROMPT</span></h2>
      <div class="uncast-block">
        <div class="uncast-label">FOUND IN THE SCREENPLAY — UNCAST</div>
        <div id="wiz-subj-tags"></div>
        <div class="row" style="margin-top:10px">
          <input type="text" id="wiz-subj-name" placeholder="add manually — name…" style="max-width:240px" title="Name of a character, vehicle, or prop the screenplay read missed.">
          <select id="wiz-subj-kind" style="max-width:150px" title="CHARACTER → likeness reference; VEHICLE → geometry reference; PROP → prop reference.">
            <option>CHARACTER</option><option>VEHICLE</option><option>PROP</option>
          </select>
          <button class="ghost" id="wiz-subj-add">+ Cast</button>
        </div>
      </div>
      <div id="wiz-subj-grid" class="subj-grid"></div>
    </div>

    <div class="panel step" data-step="4">
      <h2>Art Direction Bible <span class="step-cond">context/01_ART_DIRECTION_BIBLE.md &middot; EDITS REACH EVERY FUTURE PROMPT</span></h2>
      <!-- One primary control, at the top of the section (user, 2026-08-22:
           "I should not have to detail out how creating, editing and saving
           should work — make it all one button"). Its verb is always the
           next true thing: Create, then Edit, then Save. Regenerate joins
           it only once a bible exists, and hides again while editing. -->
      <div class="row" style="margin-top:0">
        <button id="wiz-draft" class="primary">Create Art Direction Bible</button>
        <button id="bible-regen" class="ghost hidden">Regenerate</button>
        <span class="step-cond" id="bible-cond">FROM THE ANCHORS, THE SCAN AND THE CAST &mdash; WRITTEN, SAVED, AND BREAKDOWNS OPEN</span>
        <span id="style-status" class="mini"></span>
      </div>
      <label class="wiz-notes" title="Standing instructions for the drafter — anything true of the production that is not texture, palette, light or medium.">Standing notes
        <textarea id="wiz-notes" placeholder="anything else the bible must honor — e.g. &quot;1974, but nobody smokes&quot;"></textarea>
      </label>
      <div id="wiz-draft-busy"></div>
      <textarea id="style-bible" style="min-height:340px;font-family:'Courier New',Courier,monospace;font-size:13px;margin-top:12px"></textarea>

      <!-- SWATCH_GENERATE_RULING: an act lives where its precondition is
           met; its result lives where it belongs. Generation reads the
           SAVED Bible, so it stands here; the swatches land in step 1's
           Color Palette column and this states so. Renders only once a
           save exists — step 4's own gate explains the situation two
           lines above, and saying it twice on one screen is the
           verbosity D1 cut. -->
      <div class="swatch-gen" id="swatch-gen"></div>
    </div>

    <div class="panel step" data-step="5">
      <h2>Model Test: <span class="step-cond">SAME LOCATION &middot; SAME BIBLE &middot; SAME ANCHORS</span></h2>
      <div class="row" style="margin-top:0">
        <div class="fgroup" style="flex:1;max-width:420px" title="The screenplay location every engine renders. Recommendations come from the Step 2 Script Scene Scan; free text works too. Left blank, a generic fallback scene is used."><span class="f-label">Sample location</span>
          <input type="text" id="wiz-sample-loc" list="wiz-sample-locs" placeholder="run the Step 2 Scene Scan for suggestions, or type a location…">
          <datalist id="wiz-sample-locs"></datalist>
        </div>
        <div class="gen-actions"><button class="primary" id="wiz-samples-go" title="Sends the identical brief (your Bible + style anchors + the chosen screenplay location) to every engine you have a key for — one 1K render each.">Generate a sample from every model</button></div>
      </div>
      <div id="wiz-samples-busy"></div>
      <div class="wiz-cols" id="wiz-samples" style="margin-top:12px"></div>
    </div>

  </section>
</template>

<!-- Reference: ONE library, three shelves, sorted by when an image rides
     along (mock 5a). Subject cards ARE the middle shelf. -->
<template id="tpl-references">
  <section class="view">
    <div class="panel">
      <div class="stage-kicker">THE LIBRARY</div>
      <h3 class="stage-headline">Everything a render can anchor to</h3>
      <p class="hint">Three shelves, sorted by when an image rides along. Approve to make something canon; rejecting quarantines it — Reinstate brings it back.</p>
      <div class="ref-bar">
        <input type="text" id="ref-search" class="loc-search" style="margin:0" placeholder="find in library…" title="Filters every shelf — matches IDs, roles, titles, notes, and subject names">
        <button class="ghost" id="ref-add-btn" title="Add an image to the library — one image, one job">+ Add reference</button>
        <span class="ref-counts" id="ref-counts"></span>
      </div>
    </div>
    <div id="ref-shelves"></div>
  </section>
</template>

<template id="tpl-specs">
  <section class="view">
    <!-- TWO DOORS AGAIN (user, 2026-08-22: "I want two separate columns").
         This REVERSES C1 (RULE_PASS_2 C, ruled 2026-08-18), which merged
         them; a user instruction outranks a design ruling, and the reversal
         is logged in DESIGN_SYSTEM.md so the next pass does not re-merge
         them from the same reasoning.

         That reasoning was sound about what it saw, so its three faults are
         FIXED here rather than reintroduced:
           * "the second was a strict superset of the first" — no longer
             true. The blank door has no brief, no paste and no panel list;
             it makes an empty sheet and nothing else, and the two call
             different endpoints. That is what makes them two acts.
           * "amber sat on the superseded one" — amber is on the AUTO door,
             which is the stronger one.
           * "at 1440 the grid stacked" — .intake-doors stacks at 980, so
             1440 is two columns. -->
    <div class="panel panel-lead intake">
      <h2>New breakdown</h2>
      <div class="intake-doors">
        <div class="door door-auto">
          <p class="door-head">Break it down for me
            <span class="door-nature mono">READS THE SCREENPLAY</span></p>
          <form id="spec-auto-form">
            <!-- "What should I get?" IS the search (user, 2026-08-22). A
                 match lists; no match is simply the brief, typed. It and the
                 pasted section are ALTERNATIVES — filling one disables the
                 other, because the screenplay is either read or replaced. -->
            <div class="door-row">
              <span class="door-lab">What should I get?
                <span class="f-note mono">SCREENPLAY IS READ FOR IT</span></span>
              <div class="door-field">
                <input type="text" id="spec-auto-subject" autocomplete="off"
                  placeholder="terra — start typing to find a scene, or describe the board">
                <div class="scene-find" id="spec-auto-scene-hits" hidden></div>
                <span class="f-note mono" id="spec-auto-scene-note"></span>
              </div>
            </div>

            <div class="door-row">
              <span class="door-lab">Or paste a section
                <span class="f-note mono">PASTE WINS — SCRIPT NOT READ</span></span>
              <div class="door-field">
                <textarea id="spec-auto-source" rows="3" placeholder="paste the scene — sluglines, action, dialogue"></textarea>
                <button type="button" class="text-act" id="spec-auto-open-screenplay"
                  title="Open the screenplay to copy from">Open screenplay ↗</button>
              </div>
            </div>

            <!-- A selection TAKES the paste slot (user, 2026-08-22). The
                 field above holds the scene's title and nothing else; what
                 the scan will ask for lands here, where the pasted section
                 would otherwise be. The two are alternatives anyway: a
                 pasted section replaces the screenplay, a picked scene
                 points into it. Clearing the selection brings the paste
                 row back. -->
            <div class="door-row" id="spec-auto-picked-row" hidden>
              <span class="door-lab" id="spec-auto-picked-lab">The scene
                <span class="f-note mono" id="spec-auto-picked-note"></span></span>
              <div class="door-field">
                <textarea id="spec-auto-brief" rows="3"
                  placeholder="what to extract from it"></textarea>
                <button type="button" class="text-act" id="spec-auto-unpick"
                  title="Drop the saved scene and search again">Clear selection</button>
              </div>
            </div>

            <div class="door-row">
              <span class="door-lab">Panels to include
                <span class="f-note mono">EMPTY — CONTENT DECIDES</span></span>
              <div class="door-field">
                <textarea id="spec-auto-panels" rows="3" placeholder="one per line — or leave empty"></textarea>
              </div>
            </div>

            <div class="door-row">
              <span class="door-lab">Spec ID <button type="button" class="q-help" data-help="spec-id" aria-label="What is a Spec ID?">?</button>
                <span class="f-note mono">A NAME ONLY</span></span>
              <div class="door-field">
                <input type="text" id="spec-auto-id" placeholder="GENETICS_FACTION_V001" required>
              </div>
            </div>

            <div class="door-row">
              <span class="door-lab">Mode &middot; type</span>
              <div class="door-field door-two">
                <select id="spec-auto-mode" title="CANON_EXTRACTION: an official board — only what the screenplay actually supports, tight budget for guesses. DESIGN_EXPLORATION: you are deciding new visual canon — looser budget for inferences, but unsupported inventions are still zero.">
                  <option value="CANON_EXTRACTION">CANON_EXTRACTION</option>

    <div data-subview="workflow" class="hidden">
      <div class="panel doc">
        <h2>The workflow</h2>
        <p>This app builds <b>canon-locked art direction boards</b>. The chain is:</p>
        <p class="chain">Screenplay → Cast &amp; anchors (REFERENCE) → Specification → Approve &amp; lock → Generate panels → Approve panels → Assemble 4K board → Approve board → Promote to reference</p>
        <h3>1 — Load your sources (01 Screenplay / Reference)</h3>
        <p>Upload the current screenplay on stage 01 — it maps every location the script names and how much the script says about each. There is <b>one reference library</b> (Reference), on three shelves by when an image rides along: STYLE (every render, automatically), SUBJECTS (when its subject appears on a panel — cast the film in Production Design step 3 to fill it), SCENES (when a board covers its scene). Every image has a <b>narrow role</b>: a role is the reference's jurisdiction — a <code>CHARACTER_LIKENESS</code> photo controls that character's face and build, <i>not</i> their costume or lighting. Approve a reference to make it a canon anchor; rejecting quarantines the file from the pipeline (Reinstate returns it to provisional review).</p>
        <h3>2 — Write or auto-fill a breakdown (03 Breakdowns)</h3>
        <p>A breakdown is the brief you'd give a concept artist, written down and enforceable: panels (each answering one production question), required and forbidden objects, and an <b>evidence ledger</b> — one row per visible object saying why it's allowed to exist (screenplay quote, your direction, or approved canon). Run the breakdown to have the AI read the screenplay and draft the breakdown; then edit. The CANNOT-LOCK strip lists anything approval would refuse; Approve &amp; lock freezes the breakdown with a content hash.</p>
        <h3>3 — Generate and judge takes (04 Panels)</h3>
        <p>Each panel generates individually at native 1K/2K/4K — never upscaled. Every generation re-anchors to the approved references you attach; the prompt is compiled mechanically from the locked breakdown and spells out each reference's role boundary. Takes land in the filmstrip as <b>CANDIDATE — UNAPPROVED</b> until you judge them; reject with a specific reason and it feeds the panel's future prompts. Repair region fixes a painted area with your choice of engine.</p>
        <h3>4 — Assemble the board (05 Boards)</h3>
        <p>The slot map shows the exact canvas geometry and a verdict per slot before you spend anything. Once every slot reads OK, <b>Assemble 4K board</b> composes the approved takes onto a true 4K canvas with board typography drawn by the app (never by the model). Slots crop images to fit the layout — the originals stay one click away in the judging room. How the board is presented is arranged in the composer (Arrange this board) — recorded on the board, the locked breakdown untouched. Nothing is ever blown up: a take too small to fill its slot is letterboxed and flagged instead.</p>
        <h3>5 — Close the loop</h3>
        <p>Approve the board, then <b>→ Reference</b> promotes it (or any approved panel) into the reference library — e.g. as a <code>SCENE_REFERENCE</code> anchoring that screenplay scene. Future generations attach it, so consistency tightens with every approval. That is how the system improves over time without drifting.</p>
        <h3>Canon vs. Design Exploration</h3>
        <p><b>CANON_EXTRACTION</b>: paint what the screenplay and approved canon already establish. Strict — nothing unsupported, max 2 weak inferences. For official boards.<br>
        <b>DESIGN_EXPLORATION</b>: the screenplay is silent, pitch me options. Everything is proposed-not-canon until you approve a winner and promote it.</p>
      </div>
    </div>

    <div data-subview="faq" class="hidden">
      <div class="panel doc">
        <h2>FAQ</h2>
        <h3>Why can't I generate from my sheet?</h3>
        <p>Only <b>approved &amp; locked</b> sheets can generate. The CANNOT-LOCK strip on the sheet lists exactly what approval would refuse — every required object needs a PASS evidence row, allocation must total 100%, every row needs a citation.</p>
        <h3>Why is my evidence row on HOLD?</h3>
        <p>Auto-fill marks weak inferences HOLD deliberately — the model is not allowed to promote its own guesses. Read the cited source; if you agree, set the row to PASS yourself (you are the evidence when you do — that's <code>USER_DIRECTED</code>). A sheet can't lock with HOLD rows on required objects.</p>
        <h3>What happens when I replace the screenplay?</h3>
        <p>Approved work is never invalidated. Every quoted citation on every sheet is re-searched in the new draft; quotes that vanish surface as CITE blockers on Status and in the Broken Citations panel on stage 01 — for your review, never auto-corrected.</p>
        <h3>Why did assembly warn about a panel?</h3>
        <p>That panel's render cannot fill its slot on the 4K canvas at native size. The app never upscales — it letterboxes and flags instead. Regenerate that panel at a larger size (usually 4K), or use → Full-size take, and re-approve it.</p>
        <h3>What image sizes should I use?</h3>
        <p>Iterate at 2K (cheaper, faster), regenerate final picks at 4K. Hero slots fill best with 4:3 or 3:2 aspect; the right-column strips suit 16:9 or 21:9.</p>
        <h3>What happens when I reject something?</h3>
        <p>Rejected references are physically quarantined — the pipeline cannot attach them again. Rejected candidates stay visible (dimmed) as a record. Rejection reasons are stored.</p>
        <h3>Can a generated image become a reference?</h3>
        <p>Yes — that's the point. Approve it, then <b>→ Reference</b> with a role (e.g. <code>SCENE_REFERENCE</code>). It enters the library pre-approved and anchors future work.</p>
        <h3>Where is everything stored?</h3>
        <p>Locally: <code>data/</code> holds references, screenplay, specs, boards, and your API key. <code>project_state/approval_log.md</code> is the running approval record. Nothing goes to any server except generation calls to Google.</p>
        <h3>What does a generation cost?</h3>
        <p>Each render is a paid API call to the engine you picked, billed to your key — rejected takes cost the same as approved ones, which is why validation runs before generation and the slot map shows readiness before assembly.</p>
      </div>

# CI — both test suites on every push and PR, each in its OWN environment
# so a dependency missing from one requirements file cannot be masked by
# the other (that masking shipped a 502: Form() without python-multipart
# in storefront/requirements.txt). Railway deploys main on push regardless
# (it cannot wait for CI) — a red X on main means roll back or fix forward
# IMMEDIATELY; never push main without green local suites (CLAUDE.md §
# Testing).
name: ci

on:
  push:
  pull_request:

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install product-app dependencies only
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt httpx
      - name: Product app suite
        run: python -m unittest discover -s tests -v

  storefront:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install storefront dependencies only
        run: |
          python -m pip install --upgrade pip
          pip install -r storefront/requirements.txt httpx
      - name: Storefront suite (isolated deps — catches missing requirements)
        working-directory: storefront
        run: python -m unittest discover -s tests -v
      - name: Boot check (import crashes surface here, not in production)
        working-directory: storefront
        run: python -c "from app.main import app; print('storefront imports clean')"

  # A stale release zip silently sells old product: regenerate the archive
  # from HEAD and require the staged zip's contents to match, file by file.
  # Red here = run the restage command in the error message and push.
  release-zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Staged release must match HEAD at the current VERSION
        run: |
          V=$(cat VERSION | tr -d '[:space:]')
          git -c core.autocrlf=false archive -o /tmp/fresh.zip HEAD -- app requirements.txt run.bat README.md INSTALL.md VERSION
          mkdir /tmp/fresh /tmp/canon /tmp/ver
          unzip -q /tmp/fresh.zip -d /tmp/fresh
          if [ ! -f "storefront/releases/screenboard-studio-$V.zip" ]; then
            echo "::error::no staged release for VERSION $V — run: python scripts/stage_release.py (after committing) and push the zips"
            exit 1
          fi
          unzip -q "storefront/releases/screenboard-studio-$V.zip" -d /tmp/ver
          if ! diff -r /tmp/fresh /tmp/ver > /tmp/zipdiff.txt 2>&1; then
            echo "::error::app/ changed after version $V was staged — versioned releases are immutable: bump VERSION, commit, run python scripts/stage_release.py, push"
            head -40 /tmp/zipdiff.txt
            exit 1
          fi
          unzip -q storefront/releases/screenboard-studio.zip -d /tmp/canon
          if ! diff -r /tmp/fresh /tmp/canon > /tmp/zipdiff2.txt 2>&1; then
            echo "::error::canonical screenboard-studio.zip is not the current release — run: python scripts/stage_release.py and push"
            head -40 /tmp/zipdiff2.txt
            exit 1
          fi
          echo "release $V staged, immutable, and canonical"

  # Post-deploy verification (main only): Railway deploys every push to
  # main, so after the suites pass we wait for /healthz to serve THIS
  # commit, then probe the public pages. A red job here = the site is down
  # or serving the wrong revision — roll back in the Railway dashboard.
  # GitHub emails the pusher on failure; that is the alert channel.
  # NOTE: assumes Railway has no watch-path filter (default). If watch
  # paths are ever configured, docs-only pushes would fail this job — the
  # rev check must then be relaxed to a 200-only probe.
  verify-deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [storefront]
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Railway to serve this commit (10 min budget)
        run: |
          REV="${GITHUB_SHA:0:12}"
          last=""
          for i in $(seq 1 60); do
            last=$(curl -s --max-time 10 https://www.screenboardstudio.com/healthz || true)
            if echo "$last" | grep -q "$REV"; then
              echo "serving $REV after ~$((i * 10))s"
              exit 0
            fi
            sleep 10
          done
          echo "::error::deploy never served $REV within 10 minutes (healthz: $last)"
          exit 1
      - name: Probe public pages
        run: |
          fail=0
          for u in "" pipeline terms privacy recover account signin; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "https://www.screenboardstudio.com/$u")
            echo "/$u -> $code"
            [ "$code" = "200" ] || fail=1
          done
          # The router's unclaimed page must serve its stated 404 with the
          # store chrome (T1). The 503 page cannot be provoked safely from
          # CI — it is covered by tests/test_tenant_proxy.py instead.
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "https://ci-probe-unclaimed.screenboardstudio.com/")
          echo "unclaimed router page -> $code"
          [ "$code" = "404" ] || fail=1
          curl -s --max-time 15 "https://ci-probe-unclaimed.screenboardstudio.com/" | grep -q "NO STUDIO AT THIS ADDRESS" || fail=1
          exit $fail
